# Render blueprint — https://render.com/docs/blueprint-spec
# Deploys Flow (Express API + the built React app) as one web service.
# Secret env vars are marked sync:false: set them in Render, never commit them.
services:
  - type: web
    name: flow-paypal-ai
    runtime: node
    plan: starter
    region: virginia
    # Builds the React app (web/dist) that Express serves; npm ci installs the dev tools it needs.
    buildCommand: npm ci && npm run build:web
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Bedrock (model provider)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      # Optional: pin a Bedrock model
      # - key: BEDROCK_MODEL_ID
      #   sync: false
      # PayPal sandbox app credentials (Flow mints short-lived tokens from these)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # From `npm run webhook:register -- https://<this service>.onrender.com`
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # AG Studio license, read while the React app builds
      - key: VITE_AG_STUDIO_LICENSE
        sync: false
